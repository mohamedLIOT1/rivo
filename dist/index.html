    <!-- Splash Screen -->

        <div class="rivo-front-disc">R</div>

      <h1>RIVO</h1>

    </div>

    <div id="root"></div>

    <script>
      // Fast splash removal
      window.removeSplash = () => {
        const splash = document.getElementById('splash');
        if (splash && splash.style.opacity !== '0') {
          splash.style.transition = 'opacity 0.25s ease-out';
          splash.style.opacity = '0';
          splash.style.pointerEvents = 'none';
          setTimeout(() => splash.remove(), 260);
        }
      };
      window.addEventListener('load', () => window.removeSplash());
      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(window.removeSplash, 150);
      });
      setTimeout(window.removeSplash, 1000);

      // Register updated Service Worker (Web only; strictly disabled in Tauri/Desktop to avoid asset stalls)
      if ('serviceWorker' in navigator) {
        const isDesktop = Boolean(
          window.__TAURI_INTERNALS__ ||
          window.__TAURI__ ||
          window.location.protocol === 'tauri:' ||
          window.location.hostname.includes('tauri') ||
          window.location.hostname.endsWith('.localhost')
        );
        if (isDesktop) {
          navigator.serviceWorker.getRegistrations().then(regs => {
            for (const r of regs) r.unregister();
          }).catch(() => {});
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').then(reg => {
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                newWorker?.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              });
            }).catch(() => {});
          });
        }
      }
    </script>
