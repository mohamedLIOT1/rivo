  <body class="bg-[#082621] text-[#0b1110] antialiased select-none overflow-hidden" style="font-family:'Plus Jakarta Sans',sans-serif">

    <!-- Splash Screen -->
    <div id="splash">
      <div class="rivo-logo-wrap">
        <div class="rivo-shadow-disc"></div>
        <div class="rivo-front-disc">R</div>
      </div>
      <h1>RIVO</h1>
      <p>Pure Sound Relief • Est. 1954</p>
    </div>

    <div id="root"></div>

    <script>
      // Remove splash when app is ready
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash');
          if (splash) {
            splash.style.opacity = '0';
            setTimeout(() => splash.remove(), 500);
          }
        }, 1000);
      });

      // Register updated Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              newWorker?.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                  window.location.reload();
                }
              });
            });
          }).catch(() => {});
        });
      }
    </script>
  </body>
