server {
    server_name rivo-m.duckdns.org 16.192.164.100;

    client_max_body_size 100M;

    # Ultra-fast direct kernel-level streaming for downloads (APK, IPA, EXE)
    location /downloads/ {
        alias /home/ubuntu/rivo/public/downloads/;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        expires -1;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin *;
        add_header Content-Disposition "attachment";
        types {
            application/vnd.android.package-archive apk;
            application/octet-stream ipa;
            application/octet-stream exe;
            application/zip zip;
        }
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rivo-m.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rivo-m.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = rivo-m.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name rivo-m.duckdns.org 16.192.164.100;
    return 404; # managed by Certbot
}
