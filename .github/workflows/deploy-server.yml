name: Auto-Deploy to VPS (SSH & Webhook)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'server/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.js'
      - 'index.html'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/rivo
            git fetch origin main
            git reset --hard origin/main
            npm install --legacy-peer-deps
            npm run build
            pm2 restart rivo

      - name: Ping VPS Deploy Webhook
        if: always()
        run: |
          echo "Pinging VPS webhook to trigger auto-deploy..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://rivo-m.duckdns.org/api/deploy-webhook?secret=${{ secrets.DEPLOY_SECRET || 'rivo-deploy-sec-2026' }}")
          echo "$RESPONSE"
