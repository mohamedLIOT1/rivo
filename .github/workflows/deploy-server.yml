name: Auto-Deploy to VPS (Webhook)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'server/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.js'
      - 'index.html'
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger VPS Auto-Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Ping VPS Deploy Webhook
        run: |
          echo "Pinging VPS webhook to trigger auto-deploy..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://rivo-m.duckdns.org/api/deploy-webhook?secret=${{ secrets.DEPLOY_SECRET || 'rivo-deploy-sec-2026' }}")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" -eq 200 ]; then
            echo "✅ Deployment webhook received by VPS! Server is updating in the background."
          else
            echo "ℹ️ Webhook returned status $STATUS (Normal if server is on old version; run 'git pull' once on VPS to activate)."
          fi
