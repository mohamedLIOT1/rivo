name: Build & Deploy App Releases (APK, EXE & IPA)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.9.3)'
        required: false
        default: 'latest'
      build_ios:
        description: 'Build iOS IPA (uses macOS 10x runner minutes)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Bundle
        run: npm run build

      - name: Build React Native Android Bundle
        run: npm run bundle-android

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk Rivo.apk
          cp android/app/build/outputs/apk/release/app-release.apk Rivo-${{ github.ref_name || inputs.tag_name || 'latest' }}.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rivo-Android-APK
          path: Rivo*.apk

      - name: Deploy APK to AWS Downloads
        if: env.EC2_KEY != ''
        env:
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          scp Rivo*.apk ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/rivo/public/downloads/

  build-windows:
    name: Build Windows Desktop (Tauri EXE & Setup)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies & Build Web
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Build Tauri Desktop & Installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD || 'rivo-update-key-2026' }}
        run: |
          npx --yes @tauri-apps/cli build

      - name: Prepare Tauri Release Binaries & Update Manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-desktop -Force | Out-Null
          $latestExe = Get-ChildItem "src-tauri\target\release\bundle\nsis\*setup.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $latestSig = Get-ChildItem "src-tauri\target\release\bundle\nsis\*setup.exe.sig" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          
          if ($latestExe) { Copy-Item $latestExe.FullName -Destination "release-desktop\Rivo_Setup.exe" -Force }
          if ($latestSig) { Copy-Item $latestSig.FullName -Destination "release-desktop\Rivo_Setup.exe.sig" -Force }
          if (Test-Path "src-tauri\target\release\app.exe") {
            Copy-Item "src-tauri\target\release\app.exe" -Destination "release-desktop\Rivo.exe" -Force
          }
          
          # Generate windows-update.json for Tauri in-app updater
          $sigContent = ""
          if ($latestSig) { $sigContent = (Get-Content $latestSig.FullName -Raw).Trim() }
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          
          $manifest = @{
            version = $ver
            notes = "Rivo Desktop v$ver update"
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sigContent
                url = "https://rivo-m.duckdns.org/downloads/Rivo_Setup.exe"
              }
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path "release-desktop\windows-update.json" -Value $manifest -Encoding UTF8

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rivo-Windows-Tauri
          path: release-desktop/*

      - name: Deploy Tauri Binaries & Update Manifest to AWS
        if: env.EC2_KEY != ''
        env:
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          scp release-desktop/* ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/rivo/public/downloads/


  build-ios:
    name: Build iOS IPA
    if: github.event_name == 'push' || inputs.build_ios == true
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Bundle
        run: npm run build

      - name: Expo Prebuild for iOS
        run: npx expo prebuild --platform ios --clean

      - name: Configure iOS Deployment Target and Link Media Controls
        run: |
          sed -i '' "s/platform :ios, .*/platform :ios, '15.1'/g" ios/Podfile || true
          sed -i '' "s/use_expo_modules!/use_expo_modules!\n  pod 'RivoMediaControls', :path => '..\/modules\/media-controls'/g" ios/Podfile || true
          node -e '
            const fs = require("fs");
            const file = "ios/Rivo/AppDelegate.mm";
            if (fs.existsSync(file)) {
              let code = fs.readFileSync(file, "utf8");
              if (!code.includes("<AVFoundation/AVFoundation.h>")) {
                code = code.replace("#import \"AppDelegate.h\"", "#import \"AppDelegate.h\"\n#import <AVFoundation/AVFoundation.h>");
              }
              const audioSetup = `  [[AVAudioSession sharedInstance] setCategory:AVAudioSessionCategoryPlayback withOptions:(AVAudioSessionCategoryOptionAllowBluetooth | AVAudioSessionCategoryOptionAllowBluetoothA2DP | AVAudioSessionCategoryOptionDefaultToSpeaker) error:nil];\n  [[AVAudioSession sharedInstance] setActive:YES error:nil];\n  [[UIApplication sharedApplication] beginReceivingRemoteControlEvents];\n`;
              if (!code.includes("beginReceivingRemoteControlEvents")) {
                code = code.replace(/(didFinishLaunchingWithOptions:[^{]+{)/, "$1\n" + audioSetup);
              }
              fs.writeFileSync(file, code, "utf8");
            }
          '

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS Archive (Unsigned)
        run: |
          mkdir -p build
          xcodebuild archive \
            -workspace ios/Rivo.xcworkspace \
            -scheme Rivo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Rivo.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload into Versioned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Rivo.xcarchive/Products/Applications/*.app build/Payload/
          APP_VER=$(node -p "require('./package.json').version")
          cd build
          zip -qyr "Rivo-v${APP_VER}.ipa" Payload
          cp "Rivo-v${APP_VER}.ipa" Rivo.ipa
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rivo-iOS-IPA
          path: build/Rivo*.ipa

      - name: Deploy IPA to AWS Downloads
        if: env.EC2_KEY != ''
        env:
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          scp build/Rivo*.ipa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/rivo/public/downloads/

  notify-update:
    name: Broadcast Update to Users
    needs: [build-android, build-windows, build-ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Updated Server Config & Broadcast
        if: env.EC2_KEY != ''
        env:
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          rsync -avz server/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/rivo/server/
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "pm2 restart rivo && curl -s -X POST http://localhost:5000/api/app/broadcast-update || true"
