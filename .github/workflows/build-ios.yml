name: Build iOS IPA & Android APK (Release)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Release APK for Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web & RN Android Bundle
        run: |
          npm run build
          npm run bundle-android

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk Rivo-Hybrid-${{ github.ref_name || 'latest' }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rivo-Android-APK
          path: Rivo-Hybrid-*.apk
          retention-days: 14

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Rivo ${{ github.ref_name }}
          files: |
            Rivo-Hybrid-*.apk

  build-ios:
    name: Build Unsigned IPA for iOS
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Bundle
        run: |
          npm run build

      - name: Expo Prebuild for iOS
        run: |
          npx expo prebuild --platform ios --clean

      - name: Configure iOS Deployment Target and Link Media Controls
        run: |
          sed -i '' "s/platform :ios, .*/platform :ios, '15.1'/g" ios/Podfile || true
          sed -i '' "s/use_expo_modules!/use_expo_modules!\n  pod 'RivoMediaControls', :path => '..\/modules\/media-controls'/g" ios/Podfile || true
          node -e '
            const fs = require("fs");
            const file = "ios/Rivo/AppDelegate.mm";
            if (fs.existsSync(file)) {
              let code = fs.readFileSync(file, "utf8");
              if (!code.includes("<AVFoundation/AVFoundation.h>")) {
                code = code.replace("#import \"AppDelegate.h\"", "#import \"AppDelegate.h\"\n#import <AVFoundation/AVFoundation.h>");
              }
              const audioSetup = `  [[AVAudioSession sharedInstance] setCategory:AVAudioSessionCategoryPlayback withOptions:(AVAudioSessionCategoryOptionAllowBluetooth | AVAudioSessionCategoryOptionAllowBluetoothA2DP | AVAudioSessionCategoryOptionDefaultToSpeaker) error:nil];\n  [[AVAudioSession sharedInstance] setActive:YES error:nil];\n  [[UIApplication sharedApplication] beginReceivingRemoteControlEvents];\n`;
              if (!code.includes("beginReceivingRemoteControlEvents")) {
                code = code.replace(/(didFinishLaunchingWithOptions:[^{]+{)/, "$1\n" + audioSetup);
              }
              fs.writeFileSync(file, code, "utf8");
              console.log("[CI] Configured AppDelegate.mm background audio session successfully.");
            }
          '

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS Archive (Unsigned)
        run: |
          mkdir -p build
          xcodebuild archive \
            -workspace ios/Rivo.xcworkspace \
            -scheme Rivo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Rivo.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload into Versioned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Rivo.xcarchive/Products/Applications/*.app build/Payload/
          APP_VER=$(node -p "require('./package.json').version")
          cd build
          zip -qyr "Rivo-v${APP_VER}.ipa" Payload
          cp "Rivo-v${APP_VER}.ipa" Rivo.ipa
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rivo-iOS-IPA
          path: build/Rivo*.ipa
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Rivo ${{ github.ref_name }}
          files: |
            build/Rivo*.ipa
