name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build Unsigned IPA for iOS
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Expo Prebuild for iOS
        run: |
          npx expo prebuild --platform ios --clean

      - name: Configure iOS Deployment Target and Link Media Controls
        run: |
          sed -i '' "s/platform :ios, .*/platform :ios, '15.1'/g" ios/Podfile || true
          sed -i '' "s/use_expo_modules!/use_expo_modules!\n  pod 'RivoMediaControls', :path => '..\/modules\/media-controls'/g" ios/Podfile || true
          sed -i '' "s/#import \"AppDelegate.h\"/#import \"AppDelegate.h\"\n#import <AVFoundation\/AVFoundation.h>/g" ios/Rivo/AppDelegate.mm || true
          sed -i '' "s/didFinishLaunchingWithOptions:(NSDictionary \*)launchOptions\n{/didFinishLaunchingWithOptions:(NSDictionary *)launchOptions\n{\n  [[AVAudioSession sharedInstance] setCategory:AVAudioSessionCategoryPlayback withOptions:(AVAudioSessionCategoryOptionAllowBluetooth | AVAudioSessionCategoryOptionAllowBluetoothA2DP | AVAudioSessionCategoryOptionDefaultToSpeaker) error:nil];\n  [[AVAudioSession sharedInstance] setActive:YES error:nil];\n  [[UIApplication sharedApplication] beginReceivingRemoteControlEvents];/g" ios/Rivo/AppDelegate.mm || true
          sed -i '' "s/didFinishLaunchingWithOptions:(NSDictionary \*)launchOptions {/didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {\n  [[AVAudioSession sharedInstance] setCategory:AVAudioSessionCategoryPlayback withOptions:(AVAudioSessionCategoryOptionAllowBluetooth | AVAudioSessionCategoryOptionAllowBluetoothA2DP | AVAudioSessionCategoryOptionDefaultToSpeaker) error:nil];\n  [[AVAudioSession sharedInstance] setActive:YES error:nil];\n  [[UIApplication sharedApplication] beginReceivingRemoteControlEvents];/g" ios/Rivo/AppDelegate.mm || true

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS Archive (Unsigned)
        run: |
          mkdir -p build
          xcodebuild archive \
            -workspace ios/Rivo.xcworkspace \
            -scheme Rivo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Rivo.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Rivo.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -qyr Rivo.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rivo-iOS-IPA
          path: build/Rivo.ipa
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Rivo ${{ github.ref_name }}
          files: |
            build/Rivo.ipa
